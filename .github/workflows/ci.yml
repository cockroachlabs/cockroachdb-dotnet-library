name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start CockroachDB
        # MigrationIntegrationTests connect to localhost:26257 directly;
        # Testcontainers-based fixtures use the same Docker daemon.
        run: |
          docker run -d --name crdb -p 26257:26257 \
            cockroachdb/cockroach:latest-v25.1 start-single-node --insecure
          for i in $(seq 1 60); do
            if docker exec crdb ./cockroach sql --insecure -e 'SELECT 1' >/dev/null 2>&1; then
              echo "CockroachDB ready"; break
            fi
            sleep 2
          done

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal
