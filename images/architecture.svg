<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="adapterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="testGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="metricsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#e11d48"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="absGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="740" rx="12" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">cockroachdb-dotnet-library Architecture</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Middleware Pipeline | Entity Framework | Composable NuGet Packages</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- LAYER 1: YOUR APPLICATION (rose)        -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="30" y="75" width="840" height="50" rx="8" fill="url(#appGrad)" opacity="0.9" filter="url(#shadow)"/>
  <text x="450" y="105" text-anchor="middle" fill="white" font-size="15" font-weight="600">Your Application</text>

  <!-- Arrow -->
  <line x1="450" y1="125" x2="450" y2="143" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- LAYER 2: FRAMEWORK INTEGRATION (cyan)   -->
  <!-- ═══════════════════════════════════════ -->
  <text x="44" y="160" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">FRAMEWORK INTEGRATION</text>

  <!-- Entity Framework -->
  <rect x="30" y="168" width="270" height="70" rx="8" fill="url(#adapterGrad)" filter="url(#shadow)"/>
  <text x="165" y="193" text-anchor="middle" fill="white" font-size="14" font-weight="700">Entity Framework</text>
  <line x1="50" y1="200" x2="280" y2="200" stroke="#cffafe" stroke-opacity="0.3"/>
  <text x="165" y="216" text-anchor="middle" fill="#e0f2fe" font-size="10">CockroachDBDbContext</text>
  <text x="165" y="230" text-anchor="middle" fill="#e0f2fe" font-size="10">Retry + FollowerRead Interceptors</text>

  <!-- Dependency Injection -->
  <rect x="315" y="168" width="270" height="70" rx="8" fill="url(#adapterGrad)" filter="url(#shadow)"/>
  <text x="450" y="193" text-anchor="middle" fill="white" font-size="14" font-weight="700">Dependency Injection</text>
  <line x1="335" y1="200" x2="565" y2="200" stroke="#cffafe" stroke-opacity="0.3"/>
  <text x="450" y="216" text-anchor="middle" fill="#e0f2fe" font-size="10">AddCockroachDB()</text>
  <text x="450" y="230" text-anchor="middle" fill="#e0f2fe" font-size="10">Pipeline Builder | IOptions&lt;T&gt;</text>

  <!-- Attributes -->
  <rect x="600" y="168" width="270" height="70" rx="8" fill="url(#adapterGrad)" filter="url(#shadow)"/>
  <text x="735" y="193" text-anchor="middle" fill="white" font-size="14" font-weight="700">Attributes</text>
  <line x1="620" y1="200" x2="850" y2="200" stroke="#cffafe" stroke-opacity="0.3"/>
  <text x="735" y="216" text-anchor="middle" fill="#e0f2fe" font-size="10">[CockroachDBTransaction]</text>
  <text x="735" y="230" text-anchor="middle" fill="#e0f2fe" font-size="10">[RetryableTransaction] | [FollowerRead]</text>

  <!-- Arrows down -->
  <line x1="165" y1="238" x2="165" y2="258" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="450" y1="238" x2="450" y2="258" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="735" y1="238" x2="735" y2="258" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- LAYER 3: ABSTRACTIONS (light indigo)    -->
  <!-- ═══════════════════════════════════════ -->
  <text x="44" y="275" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">ABSTRACTIONS</text>
  <rect x="30" y="282" width="840" height="55" rx="8" fill="url(#absGrad)" opacity="0.55" filter="url(#shadow)"/>

  <!-- Inner content boxes -->
  <rect x="50" y="292" width="240" height="35" rx="5" fill="rgba(255,255,255,0.1)"/>
  <text x="170" y="314" text-anchor="middle" fill="white" font-size="11" font-weight="600">Interfaces</text>
  <text x="170" y="322" text-anchor="middle" fill="#c7d2fe" font-size="8">ICockroachDBTemplate | IRetryPolicy | IHealthChecker</text>

  <rect x="310" y="292" width="300" height="35" rx="5" fill="rgba(255,255,255,0.1)"/>
  <text x="460" y="314" text-anchor="middle" fill="white" font-size="11" font-weight="600">Attributes</text>
  <text x="460" y="322" text-anchor="middle" fill="#c7d2fe" font-size="8">[CockroachDBTransaction] | [VectorSearch] | [SemanticSearch]</text>

  <rect x="630" y="292" width="220" height="35" rx="5" fill="rgba(255,255,255,0.1)"/>
  <text x="740" y="314" text-anchor="middle" fill="white" font-size="11" font-weight="600">Enums</text>
  <text x="740" y="322" text-anchor="middle" fill="#c7d2fe" font-size="8">DistanceMetric | IsolationLevel</text>

  <!-- Arrow down -->
  <line x1="450" y1="337" x2="450" y2="357" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- LAYER 4: CORE (indigo)                  -->
  <!-- ═══════════════════════════════════════ -->
  <text x="44" y="372" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">CORE</text>
  <rect x="30" y="379" width="840" height="130" rx="10" fill="url(#coreGrad)" filter="url(#shadow)"/>
  <text x="450" y="405" text-anchor="middle" fill="white" font-size="16" font-weight="700">CockroachDBTemplate</text>
  <text x="450" y="422" text-anchor="middle" fill="#c7d2fe" font-size="11">Middleware Pipeline: Retry -> CircuitBreaker -> FollowerRead -> Metrics -> Region</text>

  <!-- Core feature boxes -->
  <rect x="50" y="435" width="120" height="58" rx="6" fill="rgba(255,255,255,0.12)"/>
  <text x="110" y="455" text-anchor="middle" fill="white" font-size="11" font-weight="600">RetryPolicy</text>
  <text x="110" y="469" text-anchor="middle" fill="#c7d2fe" font-size="9">Backoff + Jitter</text>
  <text x="110" y="481" text-anchor="middle" fill="#c7d2fe" font-size="9">40001 Detection</text>

  <rect x="183" y="435" width="120" height="58" rx="6" fill="rgba(255,255,255,0.12)"/>
  <text x="243" y="455" text-anchor="middle" fill="white" font-size="11" font-weight="600">CircuitBreaker</text>
  <text x="243" y="469" text-anchor="middle" fill="#c7d2fe" font-size="9">Polly Integration</text>
  <text x="243" y="481" text-anchor="middle" fill="#c7d2fe" font-size="9">Failure Threshold</text>

  <rect x="316" y="435" width="120" height="58" rx="6" fill="rgba(255,255,255,0.12)"/>
  <text x="376" y="455" text-anchor="middle" fill="white" font-size="11" font-weight="600">FollowerRead</text>
  <text x="376" y="469" text-anchor="middle" fill="#c7d2fe" font-size="9">AS OF SYSTEM TIME</text>
  <text x="376" y="481" text-anchor="middle" fill="#c7d2fe" font-size="9">AsyncLocal Context</text>

  <rect x="449" y="435" width="100" height="58" rx="6" fill="rgba(255,255,255,0.12)"/>
  <text x="499" y="455" text-anchor="middle" fill="white" font-size="11" font-weight="600">Metrics</text>
  <text x="499" y="469" text-anchor="middle" fill="#c7d2fe" font-size="9">Counters</text>
  <text x="499" y="481" text-anchor="middle" fill="#c7d2fe" font-size="9">Durations</text>

  <rect x="562" y="435" width="100" height="58" rx="6" fill="rgba(255,255,255,0.12)"/>
  <text x="612" y="455" text-anchor="middle" fill="white" font-size="11" font-weight="600">Region</text>
  <text x="612" y="469" text-anchor="middle" fill="#c7d2fe" font-size="9">Multi-Region</text>
  <text x="612" y="481" text-anchor="middle" fill="#c7d2fe" font-size="9">Context Routing</text>

  <rect x="675" y="435" width="100" height="58" rx="6" fill="rgba(255,255,255,0.12)"/>
  <text x="725" y="455" text-anchor="middle" fill="white" font-size="11" font-weight="600">Health</text>
  <text x="725" y="469" text-anchor="middle" fill="#c7d2fe" font-size="9">HealthChecker</text>
  <text x="725" y="481" text-anchor="middle" fill="#c7d2fe" font-size="9">ASP.NET Core</text>

  <rect x="788" y="435" width="72" height="58" rx="6" fill="rgba(255,255,255,0.12)"/>
  <text x="824" y="455" text-anchor="middle" fill="white" font-size="11" font-weight="600">Errors</text>
  <text x="824" y="469" text-anchor="middle" fill="#c7d2fe" font-size="9">40001</text>
  <text x="824" y="481" text-anchor="middle" fill="#c7d2fe" font-size="9">CRDB Codes</text>

  <!-- Arrow down from core -->
  <line x1="450" y1="509" x2="450" y2="530" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- LAYER 5: SUPPORT ROW                    -->
  <!-- ═══════════════════════════════════════ -->
  <text x="44" y="548" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">SUPPORT</text>

  <!-- CDC (cyan) -->
  <rect x="30" y="555" width="270" height="75" rx="8" fill="url(#adapterGrad)" filter="url(#shadow)"/>
  <text x="165" y="580" text-anchor="middle" fill="white" font-size="14" font-weight="700">CDC</text>
  <text x="165" y="596" text-anchor="middle" fill="#cffafe" font-size="10">ChangefeedSpec | WebhookHandler</text>
  <text x="165" y="610" text-anchor="middle" fill="#cffafe" font-size="10">ChangefeedManager | CDCMetrics</text>

  <!-- AI / Vector Search (purple) -->
  <rect x="315" y="555" width="270" height="75" rx="8" fill="url(#aiGrad)" filter="url(#shadow)"/>
  <text x="450" y="580" text-anchor="middle" fill="white" font-size="14" font-weight="700">AI / Vector Search</text>
  <text x="450" y="596" text-anchor="middle" fill="#f3e8ff" font-size="10">VectorSearchTemplate | VectorStore</text>
  <text x="450" y="610" text-anchor="middle" fill="#f3e8ff" font-size="10">RagChatClient | Embeddings | C-SPANN</text>

  <!-- Testing (amber) -->
  <rect x="600" y="555" width="270" height="75" rx="8" fill="url(#testGrad)" filter="url(#shadow)"/>
  <text x="735" y="580" text-anchor="middle" fill="white" font-size="14" font-weight="700">Testing</text>
  <text x="735" y="596" text-anchor="middle" fill="#fef3c7" font-size="10">CockroachDBFixture | ConcurrencyRunner</text>
  <text x="735" y="610" text-anchor="middle" fill="#fef3c7" font-size="10">RetrySimulator | FollowerReadSimulator</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- LAYER 6: CockroachDB (green)            -->
  <!-- ═══════════════════════════════════════ -->
  <line x1="165" y1="630" x2="320" y2="660" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="450" y1="630" x2="450" y2="656" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="735" y1="630" x2="580" y2="660" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="150" y="665" width="600" height="55" rx="10" fill="url(#dbGrad)" filter="url(#shadow)"/>
  <text x="450" y="690" text-anchor="middle" fill="white" font-size="15" font-weight="700">CockroachDB</text>
  <text x="450" y="708" text-anchor="middle" fill="#dcfce7" font-size="10">Serializable | Multi-Region | Follower Reads | Native VECTOR (C-SPANN)</text>

  <!-- Legend -->
  <rect x="30" y="665" width="12" height="12" rx="3" fill="url(#adapterGrad)"/>
  <text x="48" y="675" fill="#94a3b8" font-size="10">Framework</text>
  <rect x="30" y="682" width="12" height="12" rx="3" fill="url(#coreGrad)"/>
  <text x="48" y="692" fill="#94a3b8" font-size="10">Core</text>
  <rect x="30" y="699" width="12" height="12" rx="3" fill="url(#aiGrad)"/>
  <text x="48" y="709" fill="#94a3b8" font-size="10">AI</text>
</svg>
